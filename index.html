<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <!--Exercicio 1-->
    <section class="container">
        <h1>Verificar Aprovação</h1>
        <label type="number">Digite a sua nota</label>
        <input type="number" id="nota">

        <button onclick="verificar()">Verficar</button>
        <p id="resultado"></p>
    </section>

    <!--Exercicio 2-->
    <section class="container">
        <h1>Subtração de números</h1>
        <label type="number">Digite o primeiro valor</label>
        <input type="number" id="numero1">
        <label type="number">Digite o segundo valor</label>
        <input type="number" id="numero2">

        <button onclick="subtrair()">Subtrair números</button>
        <p id="resultado1"></p>
    </section>

    <!--Exercicio 3-->
    <section class="container">
        <h1>Calculando média</h1>
        <label type="number">Digite a primeira nota</label>
        <input type="number" id="N1">
        <label type="number">Digite a segunda nota</label>
        <input type="number" id="N2">
        <label type="number">Digite a terceira nota</label>
        <input type="number" id="N3">
        <label type="number">Digite a quarta nota</label>
        <input type="number" id="N4">

        <button onclick="media()">Calcular média</button>
        <p id="aprovacao"></p>
        <p id="resultado2"></p>
        
        
    </section>
    <script src="JS/script.js"></script>
</body>
</html>
